spring.application.name=FFXIV Crafting Aggregator
server.port=8090

jwt.secret = your-92-character-ultra-secure-secret-key-string-here!!!
jwt.expiration = 86400000

xivapi.base-url = https://v2.xivapi.com
universalis.base-url = https://universalis.app

spring.datasource.url=jdbc:postgresql://localhost:5433/craft
spring.datasource.username=rayeed
