name: CraftingAggregator

services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: rayeed
      POSTGRES_PASSWORD: password
      POSTGRES_DB: craft
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5433:5432"
    networks:
      - db
    restart: unless-stopped

  adminer:
    image: adminer:latest
    restart: always
    ports:
      - "8888:8080"
    networks:
      - db
networks:
  db:
    driver: bridge
volumes:
  db: